name: Build site with Eleventy

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # Activates the Yarn version pinned in package.json's packageManager
      # field (Yarn 4). Must run before setup-node so its yarn cache works.
      - name: Enable Corepack
        run: corepack enable

      # Pinned to the current LTS rather than `lts/*`: Corepack is unbundled
      # from Node 25+, so auto-tracking a future LTS would break `yarn`.
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: yarn

      - name: Install dependencies & build
        env:
          API_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          yarn install --immutable
          yarn build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_dir: ./_site
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cname: bonfirenetworks.org
        env:
          API_TOKEN: ${{secrets.GITHUB_TOKEN}}